name: admin-save-media-item
method: POST
description: Create, update or delete a media item (audio/video/embed).
allowed_roles:
  - admin
  - editor
trigger:
  http_api:
    auth_mode: jwt
input:
  type: object
  properties:
    id: { type: string, format: uuid }
    kind: { type: string }
    title: { type: string }
    description: { type: string }
    url: { type: string }
    thumbnail_url: { type: string }
    duration_seconds: { type: integer }
    program_id: { type: string, format: uuid }
    host_id: { type: string, format: uuid }
    is_featured: { type: boolean }
    sort_order: { type: integer }
    published_at: { type: string }
    delete: { type: boolean }
workflow:
  nodes:
    - id: handler
      type: javascript_code
      variable: result
      return: true
      env_vars: []
      input_data: {}
      timeout_ms: 5000
      code_file: code/admin_save_media_item.js
