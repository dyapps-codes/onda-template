name: admin-save-sponsor
method: POST
description: Create, update or delete a sponsor.
allowed_roles:
  - admin
  - editor
trigger:
  http_api:
    auth_mode: jwt
input:
  type: object
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    logo_url: { type: string }
    link_url: { type: string }
    description: { type: string }
    sort_order: { type: integer }
    is_active: { type: boolean }
    delete: { type: boolean }
workflow:
  nodes:
    - id: handler
      type: javascript_code
      variable: result
      return: true
      env_vars: []
      input_data: {}
      timeout_ms: 5000
      code_file: code/admin_save_sponsor.js
