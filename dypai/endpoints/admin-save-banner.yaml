name: admin-save-banner
method: POST
description: Create, update or delete a banner.
allowed_roles:
  - admin
  - editor
trigger:
  http_api:
    auth_mode: jwt
input:
  type: object
  properties:
    id: { type: string, format: uuid }
    title: { type: string }
    message: { type: string }
    link_url: { type: string }
    link_label: { type: string }
    image_url: { type: string }
    color: { type: string }
    starts_at: { type: string }
    ends_at: { type: string }
    is_active: { type: boolean }
    sort_order: { type: integer }
    delete: { type: boolean }
workflow:
  nodes:
    - id: handler
      type: javascript_code
      variable: result
      return: true
      env_vars: []
      input_data: {}
      timeout_ms: 5000
      code_file: code/admin_save_banner.js
