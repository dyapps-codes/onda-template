name: admin-save-program
method: POST
description: Create or update a program. Optionally replace assigned hosts.
allowed_roles:
  - admin
  - editor
trigger:
  http_api:
    auth_mode: jwt
input:
  type: object
  required:
    - name
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    slug: { type: string }
    description: { type: string }
    image_url: { type: string }
    color: { type: string }
    category: { type: string }
    duration_minutes: { type: integer, minimum: 1 }
    external_url: { type: string }
    sort_order: { type: integer }
    is_active: { type: boolean }
    host_ids:
      type: array
      items: { type: string, format: uuid }
    delete: { type: boolean }
workflow:
  nodes:
    - id: handler
      type: javascript_code
      variable: result
      return: true
      env_vars: []
      input_data: {}
      timeout_ms: 10000
      code_file: code/admin_save_program.js
