name: admin-save-host
method: POST
description: Create, update or delete a host (presenter/redactor).
allowed_roles:
  - admin
  - editor
trigger:
  http_api:
    auth_mode: jwt
input:
  type: object
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    slug: { type: string }
    role: { type: string }
    bio: { type: string }
    photo_url: { type: string }
    social_links: { type: object }
    sort_order: { type: integer }
    is_active: { type: boolean }
    delete: { type: boolean }
workflow:
  nodes:
    - id: handler
      type: javascript_code
      variable: result
      return: true
      env_vars: []
      input_data: {}
      timeout_ms: 5000
      code_file: code/admin_save_host.js
